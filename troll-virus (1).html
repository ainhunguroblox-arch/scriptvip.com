<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading...</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#050505;color:#fff}
#app{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.loader{text-align:center;width:min(650px,85vw)}
.warn{font-size:56px;animation:pulse .7s infinite alternate}
h1{font-size:28px;margin:15px 0}
.bar{height:28px;background:#222;border:2px solid #777;border-radius:6px;overflow:hidden}
.fill{height:100%;width:0;background:#fff;transition:width .08s linear}
#percent{font-size:20px;margin-top:10px}
.popup{
 position:absolute;width:310px;background:#eee;color:#111;border:3px solid #555;
 box-shadow:8px 8px 0 #111;z-index:5;animation:shake .12s infinite alternate
}
.ptitle{background:#183a8a;color:#fff;padding:7px 10px;font-weight:bold}
.pbody{padding:16px;font-size:15px}
.pbody button{float:right;padding:4px 16px}
.final{display:none;text-align:center;z-index:20}
.final h2{font-size:clamp(32px,7vw,80px);margin:0 0 18px}
.final p{font-size:22px}
button.restart{font-size:18px;padding:10px 25px;cursor:pointer}
@keyframes pulse{to{transform:scale(1.12)}}
@keyframes shake{to{transform:translate(2px,-2px)}}
</style>
</head>
<body>
<div id="app">
  <div class="loader" id="loader">
    <div class="warn">⚠️</div>
    <h1>Đang tải dữ liệu...</h1>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div id="percent">0%</div>
  </div>

  <div class="final" id="final">
    <h2>NGU DÍNH VIRUS NHA CU 💀</h2>
  </div>
</div>

<!-- Nếu bạn có file âm thanh hợp pháp/tự sở hữu, đặt tên là eat-rice.mp3
     cùng thư mục với file HTML rồi bỏ comment dòng audio bên dưới. -->
<!-- <audio id="sound" src="eat-rice.mp3"></audio> -->

<script>
const fill=document.getElementById("fill");
const percent=document.getElementById("percent");
const loader=document.getElementById("loader");
const final=document.getElementById("final");

let progress=0, popupCount=0;

function makePopup(){
  popupCount++;
  const p=document.createElement("div");
  p.className="popup";
  p.style.left=Math.max(5,Math.random()*78)+"vw";
  p.style.top=Math.max(5,Math.random()*78)+"vh";
  p.innerHTML=`
    <div class="ptitle">⚠️ Thông báo</div>
    <div class="pbody">
      Đang xử lý... ${Math.floor(Math.random()*9999)} MB<br><br>
      <button onclick="this.closest('.popup').remove()">OK</button>
    </div>`;
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),1800);
}

const timer=setInterval(()=>{
  progress += Math.floor(Math.random()*5)+1;
  if(progress>100) progress=100;
  fill.style.width=progress+"%";
  percent.textContent=progress+"%";

  if(progress>18 && Math.random()<.42) makePopup();

  if(progress>=100){
    clearInterval(timer);
    setTimeout(()=>{
      document.querySelectorAll(".popup").forEach(x=>x.remove());
      loader.style.display="none";
      final.style.display="block";

      const audio=document.getElementById("sound");
      if(audio){ audio.currentTime=0; audio.play().catch(()=>{}); }
    },900);
  }
},180);
</script>
</body>
</html>
